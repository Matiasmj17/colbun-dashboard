<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta Colbún - iOS</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f8fafc; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 450px; margin: auto; }
        h2 { color: #1e3a8a; margin-top: 0; }
        label { display: block; margin-top: 15px; font-weight: 600; font-size: 14px; color: #334155; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        button { background: #059669; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; margin-top: 20px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #047857; }
        .success { color: #059669; font-weight: bold; margin-top: 15px; text-align: center; }
        .error { color: #dc2626; font-weight: bold; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h2>🌿 Encuesta de Satisfacción (iOS)</h2>
    <p style="color: #64748b; font-size: 14px;">Sendero Patrimonial Túnel del Agua</p>

    <!-- NOTA: Cambia esta IP por la IP que muestre la laptop en el panel de Streamlit -->
    <label>IP de la Laptop (Servidor):</label>
    <input type="text" id="ipServidor" value="192.168.137.1">

    <label>Tu Nombre o Apodo:</label>
    <input type="text" id="usuario" value="Visitante iOS" required>

    <label>Estación Evaluada:</label>
    <select id="estacion">
        <option value="Estación 1 - El Inicio">Estación 1 - El Inicio</option>
        <option value="Estación 2 - Sendero Pehuén">Estación 2 - Sendero Pehuén</option>
        <option value="Estación 3 - Flora Nativa">Estación 3 - Flora Nativa</option>
        <option value="Estación 4 - Peces del Biobío" selected>Estación 4 - Peces del Biobío</option>
        <option value="Estación 5 - Mirador Central">Estación 5 - Mirador Central</option>
    </select>

    <label>Calificación (1 a 5 estrellas):</label>
    <select id="nota">
        <option value="5">⭐⭐⭐⭐⭐ 5 - Excelente</option>
        <option value="4">⭐⭐⭐⭐ 4 - Muy Bueno</option>
        <option value="3">⭐⭐⭐ 3 - Regular</option>
        <option value="2">⭐⭐ 2 - Malo</option>
        <option value="1">⭐ 1 - Muy Malo</option>
    </select>

    <label>Comentario u Opinión:</label>
    <textarea id="comentario" rows="3" placeholder="¿Qué te parecieron los modelos AR?">¡Excelente experiencia interactiva!</textarea>

    <button onclick="enviarEncuesta()">📤 Enviar Encuesta</button>

    <div id="resultado"></div>
</div>

<script>
async function enviarEncuesta() {
    const ip = document.getElementById('ipServidor').value.trim();
    const usuario = document.getElementById('usuario').value.trim();
    const estacion = document.getElementById('estacion').value;
    const nota = parseInt(document.getElementById('nota').value);
    const comentario = document.getElementById('comentario').value.trim();
    const resultadoDiv = document.getElementById('resultado');

    const datos = {
        usuario: usuario,
        plataforma: "iOS",
        estacion: estacion,
        nota: nota,
        comentario: comentario,
        fecha: new Date().toISOString().replace('T', ' ').substring(0, 19)
    };

    resultadoDiv.innerHTML = "<p style='color: #64748b;'>Enviando a la laptop...</p>";

    try {
        const respuesta = await fetch(`http://${ip}:8000/api/encuesta`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(datos)
        });

        if (respuesta.ok) {
            const json = await respuesta.json();
            resultadoDiv.innerHTML = "<p class='success'>✅ ¡Encuesta recibida en el Dashboard!</p>";
        } else {
            throw new Error("El servidor devolvió un error: " + respuesta.status);
        }
    } catch (err) {
        resultadoDiv.innerHTML = `<p class='error'>⚠️ No se pudo conectar con la laptop (${err.message}). Revisa que estés conectado al Wi-Fi de la laptop.</p>`;
    }
}
</script>

</body>
</html>
